<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" role="img" aria-label="Layered memory security"><rect width="100%" height="100%" rx="12" fill="#ffffff"/><rect x="18.0" y="34" width="161.6" height="72" rx="10" fill="#e6eeff" stroke="#7897df" stroke-width="1.5"/><text x="98.8" y="61" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1c3150">Privilege</text><text x="98.8" y="82" font-family="Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#455b78">who executes?</text><path d="M181.6 70 H191.6" stroke="#7d91b0" stroke-width="2"/><path d="M185.6 65 L191.6 70 L185.6 75" fill="none" stroke="#7d91b0" stroke-width="2"/><rect x="193.6" y="34" width="161.6" height="72" rx="10" fill="#eee9ff" stroke="#a399e4" stroke-width="1.5"/><text x="274.4" y="61" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1c3150">Page tables</text><text x="274.4" y="82" font-family="Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#455b78">virtual permissions</text><path d="M357.2 70 H367.2" stroke="#7d91b0" stroke-width="2"/><path d="M361.2 65 L367.2 70 L361.2 75" fill="none" stroke="#7d91b0" stroke-width="2"/><rect x="369.2" y="34" width="161.6" height="72" rx="10" fill="#fff4d6" stroke="#d7ad4e" stroke-width="1.5"/><text x="450.0" y="61" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1c3150">PMP / firewall</text><text x="450.0" y="82" font-family="Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#455b78">physical regions</text><path d="M532.8 70 H542.8" stroke="#7d91b0" stroke-width="2"/><path d="M536.8 65 L542.8 70 L536.8 75" fill="none" stroke="#7d91b0" stroke-width="2"/><rect x="544.8" y="34" width="161.6" height="72" rx="10" fill="#e0f7f4" stroke="#59b6ac" stroke-width="1.5"/><text x="625.6" y="61" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1c3150">Integrity checks</text><text x="625.6" y="82" font-family="Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#455b78">detect corruption</text><path d="M708.4 70 H718.4" stroke="#7d91b0" stroke-width="2"/><path d="M712.4 65 L718.4 70 L712.4 75" fill="none" stroke="#7d91b0" stroke-width="2"/><rect x="720.4" y="34" width="161.6" height="72" rx="10" fill="#e3f7e9" stroke="#67b68a" stroke-width="1.5"/><text x="801.2" y="61" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1c3150">System policy</text><text x="801.2" y="82" font-family="Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#455b78">debug / keys</text><text x="450.0" y="137" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#62748e">Defence is layered; not every core implements every mechanism.</text></svg>