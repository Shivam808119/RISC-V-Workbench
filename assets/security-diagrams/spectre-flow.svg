<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-label="Transient execution"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#91a3bf"/></marker></defs><path d="M185 88 L220 88" stroke="#91a3bf" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M385 88 L420 88" stroke="#91a3bf" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M585 88 L620 88" stroke="#91a3bf" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="20" y="50" width="165" height="75" rx="12" fill="#eaf0ff" stroke="#d4deed"/><text x="102.5" y="76" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#26364e">Branch prediction</text><text x="102.5" y="96" text-anchor="middle" font-family="system-ui" font-size="11" fill="#63748c">predict path</text><rect x="220" y="50" width="165" height="75" rx="12" fill="#f0ebff" stroke="#d4deed"/><text x="302.5" y="76" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#26364e">Transient work</text><text x="302.5" y="96" text-anchor="middle" font-family="system-ui" font-size="11" fill="#63748c">may touch data</text><rect x="420" y="50" width="165" height="75" rx="12" fill="#fff5d9" stroke="#d4deed"/><text x="502.5" y="76" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#26364e">Microstate change</text><text x="502.5" y="96" text-anchor="middle" font-family="system-ui" font-size="11" fill="#63748c">cache / predictor</text><rect x="620" y="50" width="175" height="75" rx="12" fill="#fde9e9" stroke="#d4deed"/><text x="707.5" y="76" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#26364e">Measure signal</text><text x="707.5" y="96" text-anchor="middle" font-family="system-ui" font-size="11" fill="#63748c">infer information</text><text x="410" y="202" text-anchor="middle" font-family="system-ui" font-size="11" fill="#63748c">Transient instructions may not retire architecturally, but microarchitectural effects can remain.</text></svg>