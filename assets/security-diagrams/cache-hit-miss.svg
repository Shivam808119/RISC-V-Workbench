<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-label="Cache hit and miss"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#91a3bf"/></marker></defs><path d="M245 90 L305 90" stroke="#91a3bf" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M515 90 L575 90" stroke="#91a3bf" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="35" y="55" width="210" height="75" rx="12" fill="#e5f7ed" stroke="#d4deed"/><text x="140.0" y="81" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#26364e">Cache hit</text><text x="140.0" y="101" text-anchor="middle" font-family="system-ui" font-size="11" fill="#63748c">data nearby; usually faster</text><rect x="305" y="55" width="210" height="75" rx="12" fill="#fff5d9" stroke="#d4deed"/><text x="410.0" y="81" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#26364e">Cache miss</text><text x="410.0" y="101" text-anchor="middle" font-family="system-ui" font-size="11" fill="#63748c">fetch from next level</text><rect x="575" y="55" width="210" height="75" rx="12" fill="#eaf0ff" stroke="#d4deed"/><text x="680.0" y="81" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#26364e">Timing signal</text><text x="680.0" y="101" text-anchor="middle" font-family="system-ui" font-size="11" fill="#63748c">may reveal access pattern</text><text x="410" y="202" text-anchor="middle" font-family="system-ui" font-size="11" fill="#63748c">Timing values depend on the processor and are not universal.</text></svg>