nal Cache</text><text x="526.0" y="86" text-anchor="middle" class="s">Direct Tightly Coupled SRAM</text><path d="M594 71 H606" stroke="#64748b" stroke-width="2"/><path d="M601 67 L606 71 L601 75" fill="none" stroke="#64748b" stroke-width="2"/><rect x="606" y="34" width="136" height="74" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/><text x="674.0" y="65" text-anchor="middle" class="t">Flat M-Mode Map</text><text x="674.0" y="86" text-anchor="middle" class="s">No MMU / No TLB / No PMP</text><text x="380" y="138" text-anchor="middle" class="c">CV32E40P Memory Subsystem: Dual Open Bus Interface (OBI) master ports connect directly to Tightly Coupled Memory (TCM) with hardware post-increment addressing.</text></svg>