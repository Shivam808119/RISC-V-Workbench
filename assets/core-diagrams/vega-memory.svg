xt x="526.0" y="86" text-anchor="middle" class="s">512KB (Dual) / 1MB (Quad)</text><path d="M594 71 H606" stroke="#64748b" stroke-width="2"/><path d="M601 67 L606 71 L601 75" fill="none" stroke="#64748b" stroke-width="2"/><rect x="606" y="34" width="136" height="74" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/><text x="674.0" y="65" text-anchor="middle" class="t">AXI4-ACE Coherency</text><text x="674.0" y="86" text-anchor="middle" class="s">Hardware Multi-Core Coherence</text><text x="380" y="138" text-anchor="middle" class="c">VEGA Memory Progression: From direct AHB/AXI SRAM in ET1031 to split 8KB/32KB L1 caches, Sv39 MMU/TLBs, and 512KB–1MB ACE-coherent L2 in AS2161/AS4161.</text></svg>